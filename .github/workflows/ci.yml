name: CI

on:
  push:
    branches: [main, 1.x]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    # The 1.x line must stay valid PHP 7.1: parse every file with the real interpreters.
    name: syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.2', '7.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: |
          status=0
          for file in $(find src config routes resources tests -name '*.php'); do
            php -l "$file" > /dev/null || status=1
          done
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer config audit.block-insecure false
      - run: composer require "laravel/framework:8.*" "orchestra/testbench:^6.0" --dev --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction --with-all-dependencies
      - run: composer lint

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer config audit.block-insecure false
      - run: composer require "laravel/framework:8.*" "orchestra/testbench:^6.0" --dev --no-interaction --no-update
      - run: composer update --prefer-dist --no-interaction --with-all-dependencies
      - run: composer analyse

  tests:
    # Full Pest suite: needs PHP 7.4+ (Pest 1 and the JSON schema validator) and Laravel 6+ (PHPUnit 9).
    name: tests (Laravel ${{ matrix.laravel }}, PHP ${{ matrix.php }}${{ matrix.stability == 'prefer-lowest' && ', lowest' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '6.*', testbench: '^4.0', php: '7.4', stability: prefer-stable }
          - { laravel: '6.*', testbench: '^4.0', php: '7.4', stability: prefer-lowest }
          - { laravel: '7.*', testbench: '^5.0', php: '7.4', stability: prefer-stable }
          - { laravel: '8.*', testbench: '^6.0', php: '7.4', stability: prefer-stable }
          - { laravel: '8.*', testbench: '^6.0', php: '8.0', stability: prefer-stable }
          - { laravel: '8.*', testbench: '^6.0', php: '8.1', stability: prefer-stable }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, zlib, mbstring
          coverage: none
      - name: Allow end-of-life Laravel releases
        run: composer config audit.block-insecure false
      - name: Pin Laravel and Testbench
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --with-all-dependencies
      - name: Show installed versions
        run: composer show | grep -E '^(laravel/framework|orchestra/testbench|pestphp/pest|phpunit/phpunit) '
      - run: composer test

  smoke:
    # Laravel 5.8 and PHP 7.1/7.2 cannot run Pest: a PHPUnit smoke suite covers the core there.
    name: smoke (Laravel ${{ matrix.laravel }}, PHP ${{ matrix.php }}${{ matrix.stability == 'prefer-lowest' && ', lowest' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '5.8.*', testbench: '^3.8', php: '7.1', stability: prefer-stable }
          - { laravel: '5.8.*', testbench: '^3.8', php: '7.1', stability: prefer-lowest }
          - { laravel: '5.8.*', testbench: '^3.8', php: '7.3', stability: prefer-stable }
          - { laravel: '6.*', testbench: '^4.0', php: '7.2', stability: prefer-stable }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, zlib, mbstring
          coverage: none
      - name: Allow end-of-life Laravel releases
        run: composer config audit.block-insecure false
      - name: Drop the tools that need a newer PHP
        run: composer remove pestphp/pest pestphp/pest-plugin-laravel laravel/pint phpstan/phpstan opis/json-schema --dev --no-interaction --no-update
      - name: Pin Laravel and Testbench
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --with-all-dependencies
      - name: Show installed versions
        run: composer show | grep -E '^(laravel/framework|orchestra/testbench|phpunit/phpunit) '
      - run: vendor/bin/phpunit --testsuite Smoke
