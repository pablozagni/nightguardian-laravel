name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer lint

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer analyse

  tests:
    name: tests (Laravel ${{ matrix.laravel }}, PHP ${{ matrix.php }}${{ matrix.stability == 'prefer-lowest' && ', lowest' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 9 (Testbench 7)
          - { laravel: '9.*', testbench: '^7.0', php: '8.1', stability: prefer-stable }
          - { laravel: '9.*', testbench: '^7.0', php: '8.1', stability: prefer-lowest }
          # Laravel 10 (Testbench 8)
          - { laravel: '10.*', testbench: '^8.0', php: '8.1', stability: prefer-stable }
          - { laravel: '10.*', testbench: '^8.0', php: '8.2', stability: prefer-stable }
          # Laravel 11 (Testbench 9)
          - { laravel: '11.*', testbench: '^9.0', php: '8.2', stability: prefer-stable }
          - { laravel: '11.*', testbench: '^9.0', php: '8.3', stability: prefer-stable }
          # Laravel 12 (Testbench 10)
          - { laravel: '12.*', testbench: '^10.0', php: '8.3', stability: prefer-stable }
          - { laravel: '12.*', testbench: '^10.0', php: '8.4', stability: prefer-stable }
          # Laravel 13 (Testbench 11)
          - { laravel: '13.*', testbench: '^11.0', php: '8.3', stability: prefer-stable }
          - { laravel: '13.*', testbench: '^11.0', php: '8.4', stability: prefer-stable }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, zlib, mbstring
          coverage: none
      - name: Allow end-of-life Laravel releases
        # Old Laravel lines carry published advisories; they are only used to run the tests.
        run: composer config audit.block-insecure false
      - name: Pin Laravel and Testbench
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --with-all-dependencies
      - name: Show installed versions
        run: composer show laravel/framework orchestra/testbench pestphp/pest phpunit/phpunit | grep -E '^(name|versions)'
      - run: composer test
